[tox]
envlist = py310, py311, py312, py313, py314, py315, py314t, py315t
[testenv]
changedir = {envtmpdir}
setenv =
    LC_ALL = C
    OMP_THREAD_LIMIT = 1
passenv = TESSDATA_PREFIX
deps =
    Pillow
commands_pre = {envpython} -c "import shutil, sys; shutil.copytree(sys.argv[1], 'tests', dirs_exist_ok=True)" "{toxinidir}/tests"
commands = {envpython} -c "import sys; from tests import _run_tox; _run_tox(sys.argv[1])" "{toxinidir}"

[testenv:py314t]
basepython = python3.14t

[testenv:py315t]
basepython = python3.15t
